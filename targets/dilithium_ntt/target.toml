[source]
url    = "https://github.com/pq-crystals/dilithium"
commit = "d35ba3fe5449bee3e6d43e1f296c3ca818bd36be"
vendor = "dilithium"
files  = ["ntt.c", "reduce.c"]
entry  = "ntt"

[build]
mode = "include"
# Each butterfly's range obligations are independent of every other's; one file
# per layer makes z3 bit-blast all 128 at once and time out (§7.4, A4.6).
range_split = 16
# ntt.c also defines invntt_tomont; it is never called, and it is in the phase 5
# held-out set, so no specification for it exists before then.

[limits]
max_steps = 10000000

[expect]
phase      = 4
must_pass  = false
hints_omit = "record"
# Not one of A4.3's must-pass targets (no golden for it): G6 is unsat or classified
# under R6.
